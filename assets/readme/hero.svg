<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Production Release</title>
  <desc id="desc">A Codex Agent Skill that moves a release from request through review, publication, and consumer verification.</desc>

  <rect width="1200" height="420" rx="24" fill="#111315"/>

  <g transform="translate(64 56)">
    <rect width="162" height="34" rx="17" fill="#1D2320" stroke="#4ADE80"/>
