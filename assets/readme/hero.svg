      <text x="42" y="8" fill="#F2F4F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="650">Discover &amp; scope</text>
      <text x="42" y="31" fill="#838B91" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">rules · version · channels</text>
